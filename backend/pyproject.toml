[project]
name = "transito-rag-backend"
version = "0.1.0"
description = "TránsitoRAG backend — RAG sobre normativa de tránsito del Perú"
requires-python = ">=3.12"

# Dependencias pinneadas (ver CLAUDE.md). Todo local: sin APIs de pago.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "alembic==1.14.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "langchain==0.3.14",
    "langgraph==0.2.62",
    "langchain-ollama==0.2.2",
    "pymupdf==1.25.1",
    "httpx==0.28.1",
    "sse-starlette==2.1.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/File/Query en defaults es el patrón idiomático de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Bindings SWIG de PyMuPDF (ruido de terceros, ajeno a nuestro código)
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
]
